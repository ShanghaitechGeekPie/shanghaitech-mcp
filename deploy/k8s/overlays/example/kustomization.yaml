apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/shanghaitechgeekpie/shanghaitech-mcp
    newTag: latest
patches:
  - target:
      kind: Ingress
      name: mcp
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: mcp.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: mcp.example.com
  - target:
      kind: Deployment
      name: mcp
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
