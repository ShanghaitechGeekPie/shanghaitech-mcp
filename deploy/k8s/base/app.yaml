apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  labels:
    app.kubernetes.io/name: shanghaitech-mcp
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shanghaitech-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shanghaitech-mcp
    spec:
      # Campus platforms only accept connections from campus networks; the
      # cluster's egress is not one of them. 119.78.254.196 (acm.shanghaitech.edu.cn)
      # relays TLS by SNI (see README "校园网出口"), so the pods resolve the
      # campus hostnames to that entry and reach the real servers end to end.
      hostAliases:
        - ip: 119.78.254.196
          hostnames:
            - ids.shanghaitech.edu.cn
            - ecourse.shanghaitech.edu.cn
            - eams.shanghaitech.edu.cn
            - egate.shanghaitech.edu.cn
            - elearning.shanghaitech.edu.cn
            - elrc.shanghaitech.edu.cn
            - libspace.shanghaitech.edu.cn
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/shanghaitechgeekpie/shanghaitech-mcp:latest
          # `:latest` + IfNotPresent keeps a stale image after a rollout restart.
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: mcp-config
          env:
            - name: MCP_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: MCP_ENC_KEY
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: MCP_AUTH_TOKEN
                  optional: true
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: REDIS_REST_TOKEN
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Next.js writes runtime caches here; keep the root filesystem read-only.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shanghaitech-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
