# Secret template — do NOT commit real values.
#
# Create the real secret imperatively:
#
#   kubectl -n shanghaitech-mcp create secret generic mcp-secrets \
#     --from-literal=MCP_ENC_KEY="$(openssl rand -base64 32)" \
#     --from-literal=MCP_AUTH_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=REDIS_REST_TOKEN="$(openssl rand -hex 24)" \
#     --from-literal=REDIS_CONNECTION_STRING="redis://:$(kubectl -n shanghaitech-mcp get secret mcp-secrets -o jsonpath='{.data.REDIS_PASSWORD}' | base64 -d)@redis:6379"
#
# MCP_ENC_KEY  : 32 random bytes, base64. Seals session handles; rotating it
#                invalidates every live session (users re-run ids_login).
# MCP_AUTH_TOKEN: optional bearer for the MCP endpoint. Omit to leave it open.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-secrets
type: Opaque
stringData:
  MCP_ENC_KEY: "REPLACE_WITH_openssl_rand_base64_32"
  MCP_AUTH_TOKEN: "REPLACE_WITH_openssl_rand_hex_32"
  REDIS_PASSWORD: "REPLACE_WITH_random_password"
  REDIS_REST_TOKEN: "REPLACE_WITH_random_token"
  REDIS_CONNECTION_STRING: "redis://:REPLACE_WITH_random_password@redis:6379"
